name: Build
on: [push, pull_request]

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate self-signed cert (PFX with key)
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -keyout certs/mac.key -out certs/mac.cert -days 365 -nodes -subj "/CN=QuestDock Dev"
          openssl pkcs12 -export -in certs/mac.cert -inkey certs/mac.key -out certs/mac.p12 -passout pass:questdock-dev
      - name: Build (macOS)
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with: { name: mac-dmg, path: "dist/*.dmg" }
      - uses: actions/upload-artifact@v4
        with: { name: mac-zip, path: "dist/*.zip" }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate self-signed cert (PFX)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path certs -Force | Out-Null
          $cert = New-SelfSignedCertificate -DnsName QuestDock -KeyExportPolicy Exportable -KeyAlgorithm RSA -KeyLength 2048 -NotAfter "2030-01-01"
          $pw = New-Object System.Security.SecureString
          $cert | Export-PfxCertificate -FilePath certs/win.pfx -Password $pw
      - name: Build (Windows)
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: windows-installers, path: "dist/*.exe" }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with: { name: linux-appimage, path: "dist/*.AppImage" }
      - uses: actions/upload-artifact@v4
        with: { name: linux-deb, path: "dist/*.deb" }
