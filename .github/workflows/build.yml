name: Build
on: [push, pull_request]

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate self-signed cert
        run: mkdir -p certs && openssl req -x509 -newkey rsa:2048 -keyout certs/mac.key -out certs/mac.p12 -days 365 -nodes -subj "/CN=QuestDock Dev"
      - name: Build (macOS, self-signed cert)
        env:
          CSC_LINK: certs/mac.p12
          CSC_KEY_PASSWORD: ""
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with: { name: mac-dmg, path: "dist/*.dmg" }
      - uses: actions/upload-artifact@v4
        with: { name: mac-zip, path: "dist/*.zip" }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate self-signed cert
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path certs -Force | Out-Null
          openssl req -x509 -newkey rsa:2048 -keyout certs/win.key -out certs/win.pfx -days 365 -nodes -subj "/CN=QuestDock Dev"
      - name: Build (Windows, self-signed cert)
        env:
          WIN_CSC_LINK: certs/win.pfx
          WIN_CSC_PASSWORD: ""
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: windows-installers, path: "dist/*.exe" }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with: { name: linux-appimage, path: "dist/*.AppImage" }
      - uses: actions/upload-artifact@v4
        with: { name: linux-deb, path: "dist/*.deb" }
