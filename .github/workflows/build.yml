name: Build
on: [push, pull_request]

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate self-signed cert (PFX with key)
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -keyout certs/mac.key -out certs/mac.cert -days 365 -nodes -subj "/CN=QuestDock Dev"
          openssl pkcs12 -export -in certs/mac.cert -inkey certs/mac.key -out certs/mac.p12 -passout pass:
      - name: Export CSC_LINK (base64 PFX)
        run: echo "CSC_LINK=$(base64 -w0 certs/mac.p12)" >> "$GITHUB_ENV"
      - name: Build (macOS, self-signed)
        env:
          CSC_KEY_PASSWORD: ""
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with: { name: mac-dmg, path: "dist/*.dmg" }
      - uses: actions/upload-artifact@v4
        with: { name: mac-zip, path: "dist/*.zip" }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate self-signed cert
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path certs -Force | Out-Null
          $c = New-SelfSignedCertificate -CertificateType CodeSigning -SubjectName "CN=QuestDock Dev" -Provider "Microsoft Enhanced RSA and AES Cryptographic Provider" -KeyAlgorithm RSA -KeyLength 2048 -NotAfter "2030-01-01" -ExportCertificateArrays -FilePath certs/win.pfx
      - name: Export WIN_CSC_LINK (base64)
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("certs/win.pfx")
          Add-Content -Path $env:GITHUB_ENV -Value "WIN_CSC_LINK=$([Convert]::ToBase64String($bytes))"
      - name: Build (Windows, self-signed)
        env:
          WIN_CSC_PASSWORD: ""
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: windows-installers, path: "dist/*.exe" }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with: { name: linux-appimage, path: "dist/*.AppImage" }
      - uses: actions/upload-artifact@v4
        with: { name: linux-deb, path: "dist/*.deb" }
